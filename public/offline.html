<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Inventory UMKM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: #f8fafc; color: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
    .container { text-align: center; max-width: 320px; }
    .icon { width: 48px; height: 48px; background: #e2e8f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; }
    h1 { font-size: 1rem; font-weight: 600; color: #1e293b; margin-bottom: 0.5rem; }
    p { font-size: 0.75rem; color: #64748b; margin-bottom: 1.5rem; }
    button { padding: 0.5rem 1.25rem; background: #1e293b; color: #fff; border: none; border-radius: 0.375rem; font-size: 0.75rem; cursor: pointer; transition: background 0.15s; }
    button:hover { background: #0f172a; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg width="24" height="24" fill="none" stroke="#94a3b8" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192L5.636 18.364M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
    </div>
    <h1>Tidak Ada Koneksi</h1>
    <p>Anda sedang offline. Periksa koneksi internet dan coba lagi.</p>
    <button onclick="window.location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
